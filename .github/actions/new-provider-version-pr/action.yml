name: Create PR for new provider version
description: Create a Pull Request to publish the metadata and Markdown docs for a new version of a provider.

inputs:
  github_token:
    description: Token used to create the PR
    required: true
  provider_short_name:
    description: The short name of provider to publish the metadata/docs for.
    required: true
  provider_version:
    description: The version of provider to publish the metadata/docs for.
    required: true

runs:
  using: "composite"
  steps:
      - name: Create registry PR
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ inputs.GITHUB_TOKEN }}
          committer: Pulumi Bot <bot@pulumi.com>
          author: Pulumi Bot <bot@pulumi.com>
          commit-message: "Publish Package Metadata for ${{ inputs.provider_short_name }}@${{ inputs.provider_version }}"
          title: "Publish Package Metadata ${{ inputs.provider_short_name }}@${{ inputs.provider_version }}"
          body: ""
          # Stable per-provider branch so create-pull-request updates one PR per
          # provider instead of opening a new one each run.
          branch: "${{ inputs.provider_short_name }}/publish-metadata"
      # Whenever the PR is open, not only when this run created it: if enabling automerge failed
      # then, a later run is the only thing that will retry it. `gh pr merge --auto` also merges a
      # PR whose checks have already passed, where enabling automerge would be refused.
      - if: steps.create-pr.outputs.pull-request-number != ''
        name: Set Automerge
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
          PR: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            echo "Automerge is already enabled on #$PR."
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto
