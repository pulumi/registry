name: Community package check

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request to check
        required: true
      head:
        description: The head commit of that pull request, abbreviated to 12 characters
        required: true

run-name: "Community package check · PR #${{ inputs.pr }} · ${{ inputs.head }}"

permissions:
  contents: read

concurrency:
  group: community-check-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/resourcedocsgen/go.mod
          cache-dependency-path: tools/resourcedocsgen/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Install the Pulumi CLI (for the plugin install probe)
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Fetch the pull request's files, or refuse it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          python3 scripts/ci/community-package/cli.py fetch-pr --pr "$PR" \
            --changed-files pr-changed-files.txt

      - name: Verify the added entry and write the fact-sheet
        env:
          HEAD_SHA: ${{ inputs.head }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/ci/community-package/cli.py check --diff "origin/$BASE_REF" \
            --changed-files pr-changed-files.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fact-sheets
          path: "*.factsheet.md"

  report:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Take the fact-sheet, if the check got far enough to write one
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: fact-sheets

      - name: Post the fact-sheet as a sticky PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: python3 scripts/ci/community-package/cli.py report
