name: Community package /preview command

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to build a preview for
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-registry

concurrency:
  group: community-package-preview-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == '/preview' || startsWith(github.event.comment.body, '/preview ')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: pulumi-service-ubuntu-24.04-16core
    timeout-minutes: 60
    environment: testing
    env:
      GOPATH: ${{ github.workspace }}/go
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Acknowledge the comment and decide whether a preview is needed
        id: ack
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: python3 scripts/ci/community-package/cli.py preview-command

      - uses: ./.github/actions/build-and-deploy-preview
        if: ${{ !cancelled() && steps.ack.outputs.should_build != 'false' }}
        with:
          pr: ${{ github.event.issue.number || inputs.pr }}
          github_token: ${{ github.token }}
          pulumi_stack_name: ${{ vars.PULUMI_STACK_NAME }}
          algolia_app_id: ${{ vars.ALGOLIA_APP_ID }}
          algolia_app_search_key: ${{ vars.ALGOLIA_APP_SEARCH_KEY }}

      - name: Report a build failure on the PR
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || inputs.pr }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci/community-package/cli.py preview-failed
