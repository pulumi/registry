name: Community package check sweep

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read
  contents: read

concurrency:
  group: community-check-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Dispatch a check for every unchecked community package PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/ci/community-package/cli.py sweep

  report-failure:
    if: failure()
    name: Open a p1 issue for the daily digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sweep]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open the failure issue, or leave the open one alone
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python3 scripts/ci/community-package/cli.py sweep-failed
