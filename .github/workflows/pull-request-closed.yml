permissions: write-all # Equivalent to default permissions plus id-token: write
env:
  ESC_ACTION_ENVIRONMENT: pulumi/github-secrets/pulumi-registry
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
name: Close pull request
on:
  pull_request:
    types:
      - closed
jobs:
  cleanup:
    # Only run this job for events that originate on this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Find and remove buckets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Authenticate to Pulumi Cloud
        id: pulumi-auth
        uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119 # v4.0.0
        with:
          pulumi-access-token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::571684982431:role/ContinuousDelivery
          role-duration-seconds: 7200
          role-session-name: PullRequestCleanupSession

      - name: Find and remove buckets
        run: make ci-pull-request-closed
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
