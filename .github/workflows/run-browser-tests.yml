name: "Scheduled jobs: Run browser tests"
on:
  schedule:
    # Run every day at 2:00PM UTC.
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
jobs:
  all:
    env:
      GOPATH: ${{ github.workspace }}/go
    name: Run browser tests
    runs-on: pulumi-ubuntu-8core
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::388588623842:role/ContinuousDelivery
          role-session-name: docs-deploy
          role-duration-seconds: 7200
          aws-region: us-west-2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      # Specs that check third-party services rather than the change in a PR, so they don't
      # belong in the preview smoke test in scripts/ci/sync.sh. Don't point Cypress at
      # www.pulumi.com here: its WAF blocks an IP after 500 requests in 5 minutes, and serves
      # the block as a 404.
      - name: Run scheduled Cypress specs
        run: |
          make ensure
          ./scripts/run-browser-tests.sh "https://www.pulumi.com" "opentofu-contract.cy.js"

      - name: Run browser tests
        if: ${{ !cancelled() }}
        run: make run-browser-tests
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
