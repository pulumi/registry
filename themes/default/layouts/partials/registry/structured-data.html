{{/*
    Structured data (JSON-LD) for Pulumi Registry pages.

    Emits a single `@graph` array inside one <script type="application/ld+json">
    block per page. All nodes share one JSON-LD document, which is the only
    scope Google (and structured-data tooling generally) demonstrates resolving
    `@id` references within -- see
    https://developers.google.com/search/docs/appearance/structured-data/sd-policies.
    Previously each node was emitted as its own standalone <script> block with
    no `@id` at all; that meant every reference to Pulumi-as-publisher was a
    repeated inline literal instead of a pointer to one entity.

    Graph always includes:
      - Organization, a minimal node identified by the SAME `@id`
        (https://www.pulumi.com/#organization) the docs site's own
        graph-builder partial uses for the canonical Pulumi entity. Every
        "publisher" field below that represents Pulumi itself (not a
        third-party provider) points at this node by `@id` instead of
        repeating an inline literal. This is a single-source-of-truth /
        entity-consistency fix, not a claimed ranking or AI-citation lever.
      - BreadcrumbList, for every registry page.

    Conditionally includes:
      - WebSite for the registry index page.
      - SoftwareSourceCode for the package overview page. Matches npmjs.com's
        convention for a provider library / SDK consumed by Pulumi.
      - HowTo for installation-configuration pages.
      - TechArticle / APIReference for individual API doc pages (not the
        api-docs section index, which only gets a BreadcrumbList).
      - FAQPage for pages whose front matter sets `faq: true`.

    Note: "author" fields on SoftwareSourceCode/TechArticle name the
    third-party package publisher (e.g. AWS, Cloudflare) via $pkg.publisher --
    that is a different real-world entity than Pulumi and must never be
    conflated with the Organization node above.

    Path detection uses .RelPermalink rather than .File.Path because some
    registry pages -- notably api-docs section indexes -- are generated by
    resourcedocsgen and have no backing file, leaving .File nil.

    The whole graph is built as a slice of Go-template dicts and emitted once
    via `jsonify | safeJS`. The safeJS pipe is required: `html/template`
    auto-escapes values inside <script> contexts, which double-encodes any
    already-JSON-quoted string from `jsonify`. `safeJS` marks the output as
    trusted and disables the second round of escaping.

    Package metadata is sourced from the package YAML at
    themes/default/data/registry/packages/<name>.yaml via
    site.Data.registry.packages.<name>.
*/}}

{{ $rel := .RelPermalink }}
{{ $trimmed := strings.TrimPrefix "/" (strings.TrimSuffix "/" $rel) }}
{{ $segments := split $trimmed "/" }}
{{ $segCount := len $segments }}

{{ $packageName := "" }}
{{ if and (ge $segCount 3) (eq (index $segments 0) "registry") (eq (index $segments 1) "packages") }}
    {{ $packageName = index $segments 2 }}
{{ end }}
{{ $pkg := index .Site.Data.registry.packages $packageName }}

{{/* Derive page kind from path shape. */}}
{{ $kind := "" }}
{{ if $packageName }}
    {{ if eq $segCount 3 }}
        {{ $kind = "overview" }}
    {{ else if eq (index $segments 3) "installation-configuration" }}
        {{ $kind = "install" }}
    {{ else if eq (index $segments 3) "api-docs" }}
        {{ if eq $segCount 4 }}
            {{ $kind = "api-docs-root" }}
        {{ else }}
            {{ $kind = "api-docs-leaf" }}
        {{ end }}
    {{ else if eq (index $segments 3) "how-to-guides" }}
        {{ $kind = "how-to" }}
    {{ end }}
{{ end }}

{{/* Canonical Pulumi entity identifier, shared with the docs site's own
     graph-builder partial (layouts/partials/schema/graph-builder.html), so
     the two properties describe one real-world entity with one identifier
     instead of two. Kept minimal here on purpose: the full description,
     logo, address, and sameAs list live where the entity is actually
     defined (the docs site's home page graph); this is a reference node. */}}
{{ $orgID := "https://www.pulumi.com/#organization" }}
{{ $orgRef := dict "@id" $orgID }}
{{ $graph := slice (dict "@type" "Organization" "@id" $orgID "name" "Pulumi" "url" "https://www.pulumi.com/") }}

{{/* ---------- WebSite (registry index page only) ---------- */}}
{{ if eq $rel "/registry/" }}
    {{ $website := dict
        "@type" "WebSite"
        "@id" (printf "%s#website" (absURL "registry/"))
        "name" "Pulumi Registry"
        "url" (absURL "registry/")
        "description" "The public index of Pulumi packages — find providers, components, and cloud infrastructure building blocks."
        "inLanguage" "en-US"
        "publisher" $orgRef
    }}
    {{ $graph = $graph | append $website }}
{{ end }}

{{/* ---------- BreadcrumbList (every registry page) ---------- */}}
{{ $crumbs := slice (dict "@type" "ListItem" "position" 1 "name" "Registry" "item" (absURL "registry/")) }}
{{ if $pkg }}
    {{ $crumbs = $crumbs | append (dict "@type" "ListItem" "position" 2 "name" $pkg.title "item" (printf "%sregistry/packages/%s/" (absURL "") $packageName)) }}
    {{ if or (eq $kind "api-docs-root") (eq $kind "api-docs-leaf") }}
        {{ $crumbs = $crumbs | append (dict "@type" "ListItem" "position" 3 "name" "API Docs" "item" (printf "%sregistry/packages/%s/api-docs/" (absURL "") $packageName)) }}
    {{ else if eq $kind "install" }}
        {{ $crumbs = $crumbs | append (dict "@type" "ListItem" "position" 3 "name" "Installation & Configuration" "item" (printf "%sregistry/packages/%s/installation-configuration/" (absURL "") $packageName)) }}
    {{ else if eq $kind "how-to" }}
        {{ $crumbs = $crumbs | append (dict "@type" "ListItem" "position" 3 "name" "How-to Guides" "item" (printf "%sregistry/packages/%s/how-to-guides/" (absURL "") $packageName)) }}
    {{ end }}
{{ end }}
{{ $breadcrumb := dict "@type" "BreadcrumbList" "@id" (printf "%s#breadcrumb" .Permalink) "itemListElement" $crumbs }}
{{ $graph = $graph | append $breadcrumb }}

{{ if $pkg }}

{{/* ---------- SoftwareSourceCode (package overview page only) ---------- */}}
{{ if eq $kind "overview" }}
    {{ $ssc := dict
        "@type" "SoftwareSourceCode"
        "@id" (printf "%s#software" .Permalink)
        "name" (printf "%s Pulumi Provider" $pkg.title)
        "alternateName" $pkg.title
        "url" .Permalink
        "mainEntityOfPage" .Permalink
        "description" $pkg.description
        "inLanguage" "en-US"
        "programmingLanguage" (slice "TypeScript" "Python" "Go" "C#" "Java" "YAML")
        "runtimePlatform" "Pulumi"
        "isPartOf" (dict "@type" "SoftwareSourceCode" "name" "Pulumi" "url" "https://www.pulumi.com/")
        "author" (dict "@type" "Organization" "name" $pkg.publisher)
        "publisher" $orgRef
    }}
    {{ with $pkg.version }}{{ $ssc = merge $ssc (dict "version" .) }}{{ end }}
    {{ with $pkg.repo_url }}{{ $ssc = merge $ssc (dict "codeRepository" .) }}{{ end }}
    {{ with $pkg.logo_url }}{{ $ssc = merge $ssc (dict "image" .) }}{{ end }}
    {{ with $pkg.category }}{{ $ssc = merge $ssc (dict "keywords" (printf "Pulumi, Infrastructure as Code, %s, %s provider" . $pkg.title)) }}{{ end }}
    {{ with $pkg.updated_on }}
        {{ $ts := time . | time.Format "2006-01-02T15:04:05Z" }}
        {{ $ssc = merge $ssc (dict "dateModified" $ts) }}
    {{ end }}
    {{ if not $.PublishDate.IsZero }}{{ $ssc = merge $ssc (dict "datePublished" (time.Format "2006-01-02T15:04:05Z" $.PublishDate)) }}{{ end }}
    {{ $graph = $graph | append $ssc }}
{{ end }}

{{/* ---------- HowTo (installation-configuration page) ---------- */}}
{{ if eq $kind "install" }}
    {{ $howto := dict
        "@type" "HowTo"
        "@id" (printf "%s#howto" .Permalink)
        "name" (printf "Install and configure the %s Pulumi provider" $pkg.title)
        "description" (printf "How to install and configure the %s provider for Pulumi to manage %s resources as code." $pkg.title $pkg.title)
        "url" .Permalink
        "mainEntityOfPage" .Permalink
        "inLanguage" "en-US"
        "educationalLevel" "Beginner"
        "tool" (slice
            (dict "@type" "HowToTool" "name" "Pulumi CLI")
            (dict "@type" "HowToTool" "name" "Node.js, Python, Go, .NET, or Java")
        )
        "about" (dict
            "@type" "SoftwareSourceCode"
            "name" (printf "%s Pulumi Provider" $pkg.title)
            "url" (printf "%sregistry/packages/%s/" (absURL "") $packageName)
        )
    }}
    {{ with $pkg.updated_on }}{{ $howto = merge $howto (dict "dateModified" (time . | time.Format "2006-01-02T15:04:05Z")) }}{{ end }}
    {{ if not $.PublishDate.IsZero }}{{ $howto = merge $howto (dict "datePublished" (time.Format "2006-01-02T15:04:05Z" $.PublishDate)) }}{{ end }}
    {{ $graph = $graph | append $howto }}
{{ end }}

{{/* ---------- TechArticle / APIReference (individual API doc pages only) ---------- */}}
{{ if eq $kind "api-docs-leaf" }}
    {{ $article := dict
        "@type" (slice "TechArticle" "APIReference")
        "@id" (printf "%s#article" .Permalink)
        "headline" .Title
        "name" .Title
        "url" .Permalink
        "mainEntityOfPage" .Permalink
        "inLanguage" "en-US"
        "articleSection" "API Reference"
        "isPartOf" (dict
            "@type" "SoftwareSourceCode"
            "name" (printf "%s Pulumi Provider" $pkg.title)
            "url" (printf "%sregistry/packages/%s/" (absURL "") $packageName)
        )
        "about" (dict
            "@type" "SoftwareSourceCode"
            "name" (printf "%s Pulumi Provider" $pkg.title)
        )
        "author" (dict "@type" "Organization" "name" $pkg.publisher)
        "publisher" $orgRef
    }}
    {{ with .Params.meta_desc }}{{ $article = merge $article (dict "description" .) }}{{ end }}
    {{ with $pkg.updated_on }}{{ $article = merge $article (dict "dateModified" (time . | time.Format "2006-01-02T15:04:05Z")) }}{{ end }}
    {{ if not $.PublishDate.IsZero }}{{ $article = merge $article (dict "datePublished" (time.Format "2006-01-02T15:04:05Z" $.PublishDate)) }}{{ end }}
    {{ $graph = $graph | append $article }}
{{ end }}

{{/* ---------- FAQPage (pages with faq: true in front matter) ---------- */}}
{{/*
    Extracts Q&A pairs from page content by splitting on <h2> tags.
    Each h2 becomes a question; the content between h2s becomes the answer.
    The page must set `faq: true` in its front matter AND contain <h2> elements.
    Schema must reflect visible page content — do not add faq: true to pages
    without actual Q&A content.
*/}}
{{ if eq .Params.faq true }}
    {{ $content := .Content }}
    {{ $parts := split $content "<h2 id=" }}
    {{ $qaItems := slice }}
    {{ range $i, $part := $parts }}
        {{ if gt $i 0 }}
            {{/* Each $part looks like: 'some-slug">Question text</h2>Answer HTML...' */}}
            {{ $h2Split := split $part "</h2>" }}
            {{ if ge (len $h2Split) 2 }}
                {{/* Extract question text: strip the 'slug">' prefix using replaceRE. */}}
                {{ $raw := index $h2Split 0 }}
                {{ $question := replaceRE `^[^>]*>` "" $raw }}
                {{/* Rejoin remaining segments as answer (in case answer itself contained </h2>). */}}
                {{ $answerParts := after 1 $h2Split }}
                {{ $answer := delimit $answerParts "</h2>" | replaceRE `^\s+` "" }}
                {{ if and $question $answer }}
                    {{ $qaItems = $qaItems | append (dict
                        "@type" "Question"
                        "name" $question
                        "acceptedAnswer" (dict "@type" "Answer" "text" $answer)
                    ) }}
                {{ end }}
            {{ end }}
        {{ end }}
    {{ end }}
    {{ if gt (len $qaItems) 0 }}
        {{ $faq := dict
            "@type" "FAQPage"
            "@id" (printf "%s#faq" .Permalink)
            "inLanguage" "en-US"
            "mainEntity" $qaItems
        }}
        {{ $graph = $graph | append $faq }}
    {{ end }}
{{ end }}

{{ end }}

{{ $doc := dict "@context" "https://schema.org" "@graph" $graph }}
<script type="application/ld+json">{{ $doc | jsonify | safeJS }}</script>
